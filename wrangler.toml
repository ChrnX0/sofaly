# Cópia do server/api/wrangler.toml para o Workers Builds da Cloudflare (19/11/2026).
# O Worker sofaly-api está ligado a este repositório e, a cada merge na main, a Cloudflare roda `npx wrangler deploy`
# AQUI NA RAIZ. Sem este arquivo o wrangler subia a raiz como site estático vazio e a API inteira caía (404).
# Mudou algo em server/api/wrangler.toml? Mude igual aqui (só `main` muda de caminho); server/api/test/config.test.js confere.
name = "sofaly-api"
main = "server/api/src/index.js"
compatibility_date = "2026-11-01"
workers_dev = false   # só pelo domínio próprio (rota abaixo)

routes = [{ pattern = "api.sofaly.tv", custom_domain = true }]

[vars]
DISABLED = "0"   # "1" desliga tudo (as TVs seguem funcionando em casa e avisam o que ficou indisponível)
# Clima do Básico (src/weatherOpen.js): Open-Meteo paga (plano Standard, escolha do Paulo em 24/11/2026). A chave vai
# no secret OPEN_MODELS_KEY; sem ela a rota responde 503 e as TVs ficam no MET Norway.
OPEN_MODELS_URL = "https://customer-api.open-meteo.com/v1/forecast"
# Versões que as TVs não instalam (src/updates.js): versionCodes separados por vírgula. Vazio = nenhuma.
UPDATES_HOLD = ""

# Previews (cada PR fora da main, Workers Builds roda `npx wrangler preview`): sem este bloco o build do PR falhava.
# DISABLED = "1": a versão de preview responde 503 em tudo e nunca toca nos Durable Objects nem nos limites de produção.
[previews.vars]
DISABLED = "1"

[[durable_objects.bindings]]
name = "MAILBOX"
class_name = "Mailbox"

[[durable_objects.bindings]]
name = "PAIRING"
class_name = "Pairing"

# Fichas comunitárias da Sofy (src/community.js): um Durable Object só, com SQLite.
[[durable_objects.bindings]]
name = "COMMUNITY"
class_name = "Community"

# Cota do dia por aparelho e por rede (src/quota.js, item 23): um Durable Object por chave.
[[durable_objects.bindings]]
name = "QUOTA"
class_name = "Quota"

# Relatos de problema, guardados em particular (src/reports.js, item 6).
[[durable_objects.bindings]]
name = "REPORTS"
class_name = "Reports"

# SQLite nos Durable Objects: único tipo aceito no plano grátis.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Mailbox", "Pairing"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Community"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Quota", "Reports"]

# Limites da previsão do tempo (src/weather.js). Rate Limiting dos Workers: contadores por borda, period 10 ou 60 s.
# Por IP: uma TV pede no máximo umas poucas vezes por hora; 30/min sobra para uma casa com várias TVs atrás do mesmo IP.
[[ratelimits]]
name = "WEATHER_IP_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Chamadas à WeatherAPI (fora do cache), todas as TVs juntas: 20/min ~ 864 mil/mês, abaixo do 1 milhão/mês do plano Free.
[[ratelimits]]
name = "WEATHER_UPSTREAM_LIMITER"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

# Busca e "em alta" de podcasts (src/podcasts.js). Por IP: a TV pede poucas vezes por minuto (digitar a busca).
[[ratelimits]]
name = "PODCASTS_IP_LIMITER"
namespace_id = "1003"
simple = { limit = 30, period = 60 }

# Chamadas ao Podcast Index (fora do cache), todas as TVs juntas.
[[ratelimits]]
name = "PODCASTS_UPSTREAM_LIMITER"
namespace_id = "1004"
simple = { limit = 60, period = 60 }

# Texto da fala e resumo (src/transcribe.js, 21/11/2026): Workers AI. No plano Free, 10 mil neurônios/dia e para (não cobra).
[ai]
binding = "AI"

# Por IP: uma TV manda um pedaço de ~2 min de áudio por vez; 12/min sobra e segura quem quiser gastar a cota de todos.
[[ratelimits]]
name = "TRANSCRIBE_IP_LIMITER"
namespace_id = "1005"
simple = { limit = 12, period = 60 }

# Clima do Básico (src/weatherOpen.js, 24/11/2026): chamadas ao servidor de modelos abertos (fora do cache), todas as
# TVs juntas. 60/min ~ 2,6 milhões/mês; cada célula da grade gasta 2 pedidos a cada 30 min.
# OPEN_MODELS_URL (var) e OPEN_MODELS_KEY (secret, só se for a customer-api paga da Open-Meteo) ligam a rota.
[[ratelimits]]
name = "OPEN_MODELS_LIMITER"
namespace_id = "1006"
simple = { limit = 60, period = 60 }

# Fichas comunitárias: cada TV manda uma vez por dia; 5/min por IP sobra para uma casa com várias TVs.
[[ratelimits]]
name = "COMMUNITY_IP_LIMITER"
namespace_id = "1007"
simple = { limit = 5, period = 60 }
